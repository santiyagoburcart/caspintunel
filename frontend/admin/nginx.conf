server {
  listen 80;
  root /usr/share/nginx/html;
  # hashed bundles never change: cache for a year; index.html is always revalidated so a
  # deploy reaches every browser on the next load (no stale UI after an update)
  location /panel/assets/ {
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /panel/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /panel/index.html;
    add_header Cache-Control "no-cache" always;
  }
  location = /panel { return 301 /panel/; }
}
