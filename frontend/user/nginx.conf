server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # hashed bundles never change: cache for a year; index.html is always revalidated so a
  # deploy reaches every browser on the next load (no stale UI after an update)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  # leftover service-worker URLs: a script that unregisters itself (never cached)
  location ~ ^/(sw|service-worker|serviceworker)\.js$ {
    add_header Cache-Control "no-store" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }
}
