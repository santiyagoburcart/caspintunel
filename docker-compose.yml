# Base compose — development-friendly (Django runserver, ports exposed).
# Production overrides live in docker-compose.prod.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: caspintunel

x-backend-env: &backend-env
  env_file: [.env]

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    build: ./backend
    image: caspintunel-backend
    restart: unless-stopped
    <<: *backend-env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "1"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
      - ./backups:/app/backups
      - /proc:/hostproc:ro             # monitoring: host net stats via /hostproc/1/net
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: ./backend
    image: caspintunel-backend
    restart: unless-stopped
    <<: *backend-env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "0"
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
      - media_data:/app/media
      - ./backups:/app/backups
    depends_on:
      - web
      - redis

  celery_beat:
    build: ./backend
    image: caspintunel-backend
    restart: unless-stopped
    <<: *backend-env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "0"
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
    depends_on:
      - web
      - redis

  frontend_user:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_TARGET: http://web:8000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./frontend/user:/app
      - fe_user_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

  frontend_admin:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_TARGET: http://web:8000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./frontend/admin:/app
      - fe_admin_modules:/app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - web

  nginx:
    build: ./nginx
    image: caspintunel-nginx
    restart: unless-stopped
    environment:
      SSL_DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
      - ./nginx/manual-certs:/etc/nginx/manual-certs:ro
    depends_on:
      - web
      - frontend_user
      - frontend_admin

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
    # renew twice a day; nginx reloads every 6h and picks up new certs
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet || true; sleep 12h & wait $${!}; done"]

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      - db

  # Self-hosted Postfix + Dovecot (docker-mailserver). Signs DKIM, enforces
  # SPF/DMARC. NOTE: many cloud hosts (incl. Vultr) block OUTBOUND port 25, so
  # external delivery needs a relay — set SMTP_RELAY_* in .env to enable it.
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:14.0
    hostname: mail.${DOMAIN:-aicaspin.ir}
    restart: unless-stopped
    environment:
      OVERRIDE_HOSTNAME: mail.${DOMAIN:-aicaspin.ir}
      POSTMASTER_ADDRESS: postmaster@${DOMAIN:-aicaspin.ir}
      ENABLE_OPENDKIM: 1
      ENABLE_OPENDMARC: 1
      ENABLE_POLICYD_SPF: 1
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      ENABLE_RSPAMD: 0
      ENABLE_FAIL2BAN: 0
      ENABLE_POP3: 0
      ONE_DIR: 1
      PERMIT_DOCKER: connected-networks
      SSL_TYPE: manual
      SSL_CERT_PATH: /etc/letsencrypt/live/${DOMAIN:-aicaspin.ir}/fullchain.pem
      SSL_KEY_PATH: /etc/letsencrypt/live/${DOMAIN:-aicaspin.ir}/privkey.pem
      RELAY_HOST: ${SMTP_RELAY_HOST:-}
      RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      RELAY_USER: ${SMTP_RELAY_USER:-}
      RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - ./mail/data:/var/mail
      - ./mail/state:/var/mail-state
      - ./mail/logs:/var/log/mail
      - ./mail/config:/tmp/docker-mailserver
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    cap_add: [NET_ADMIN]
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':587' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # --- Telegram bots (idle until a TelegramConfig token is set in the admin) ---
  bot_sales:
    build: ./backend
    image: caspintunel-backend
    restart: unless-stopped
    <<: *backend-env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "0"
    command: python manage.py run_sales_bot
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
    depends_on:
      - web
      - redis

  bot_backup:
    build: ./backend
    image: caspintunel-backend
    restart: unless-stopped
    <<: *backend-env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "0"
    command: python manage.py run_backup_bot
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
      - ./backups:/app/backups
    depends_on:
      - web
      - redis

volumes:
  db_data:
  redis_data:
  media_data:
  static_data:
  fe_user_modules:
  fe_admin_modules:
