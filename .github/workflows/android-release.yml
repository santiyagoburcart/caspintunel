# Android SMS Bridge (mobile_sms/) — v1.48
#
# * push to main touching mobile_sms/ (or this file): unit tests + an unsigned debug build (does it compile?).
# * a `v*` tag, or "Run workflow" with a tag: unit tests + a SIGNED release APK attached to that GitHub release as
#   SmsBridge-<versionName>.apk. The panel copies the newest one to the server (backend apps/settings_app/ci_apk.py).
#
# Signing needs 4 repository secrets (docs: mobile_sms/README.md#signed-release-apk):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the release job only prints a warning (nothing is published).
name: Android SMS Bridge

on:
  push:
    branches: [main]
    paths: ["mobile_sms/**", ".github/workflows/android-release.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the signed APK to (e.g. v1.48.0)"
        required: true

concurrency:
  group: android-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Unit tests + debug build
        working-directory: mobile_sms
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # attach the APK to the release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Signing secrets present?
        id: secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android signing secrets are not set — no APK for $TAG. Add them, then Actions → Android SMS Bridge → Run workflow with tag $TAG."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Build and sign
        if: steps.secrets.outputs.ok == 'true'
        working-directory: mobile_sms
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"            # outside the checkout, removed with the runner
          printf '%s' "$KS" | base64 --decode > "$KEYSTORE"
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$KSP" \
            -Pandroid.injected.signing.key.alias="$KA" \
            -Pandroid.injected.signing.key.password="$KP"
          rm -f "$KEYSTORE"
          VERSION=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' app/build.gradle)
          [ -n "$VERSION" ] || { echo "::error::versionName not found in app/build.gradle"; exit 1; }
          APK="$GITHUB_WORKSPACE/SmsBridge-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Attach to the GitHub release
        if: steps.secrets.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.APK }}
          fail_on_unmatched_files: true
