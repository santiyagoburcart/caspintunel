# DEV reverse proxy: API -> Django, SPAs -> Vite dev servers.
# Production uses nginx/prod.conf (mounted by docker-compose.prod.yml).
# TLS: 40-ssl.sh drops a 10-ssl.conf here when a Let's Encrypt cert exists.

upstream django { server web:8000; }
upstream spa_user { server frontend_user:5173; }
upstream spa_admin { server frontend_admin:5174; }

server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ { proxy_pass http://django; }
    location /media/  { proxy_pass http://django; }

    location ~ ^/(api|admin)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /panel/ {
        proxy_pass http://spa_admin;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://spa_user;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
