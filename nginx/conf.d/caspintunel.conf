# DEV reverse proxy: API -> Django, SPAs -> Vite dev servers.
# Production uses nginx/prod.conf (mounted by docker-compose.prod.yml).
# TLS: nginx-entrypoint.sh drops a 10-ssl.conf here when a cert exists.

# Docker's embedded DNS + variable proxy_pass -> upstreams are re-resolved at
# request time, so recreating a backend container doesn't cause stale 502s.
resolver 127.0.0.11 valid=10s ipv6=off;

# The HTTPS vhost (10-ssl.conf) terminates TLS and proxies to this plain-HTTP
# vhost on 127.0.0.1 with "X-Forwarded-Proto: https". Only trust that header
# from 127.0.0.1 — otherwise Django (SECURE_SSL_REDIRECT) would see every HTTPS
# request as http and redirect forever, and outside clients could spoof it.
# Real client IP for Django (throttling). Same trust rule: the TLS vhost on
# 127.0.0.1 passes it as X-Real-IP; anyone else is taken at $remote_addr.
# Django gets exactly ONE address (X-Forwarded-For is overwritten, never
# appended), so a client-supplied X-Forwarded-For can't pick its own
# rate-limit bucket. DRF reads it with NUM_PROXIES = 1.
map $remote_addr $client_ip {
    "127.0.0.1"  $http_x_real_ip;
    default      $remote_addr;
}

map "$remote_addr|$http_x_forwarded_proto" $fwd_proto {
    "~^127\.0\.0\.1\|https$"  https;
    default                     $scheme;
}

# Looser CSP than prod (Vite dev server needs inline scripts, eval, HMR ws).
# The user site (/) additionally allows the Telegram SDK + being framed by
# Telegram; the panel / API / Django admin stay locked to frame-ancestors 'none'.
map $uri $csp {
    "~^/(api|admin|panel)(/|$)"  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
    default                      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self' https://telegram.org https://*.telegram.org; base-uri 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy $csp always;

    set $django "http://web:8000";
    set $spa_user "http://frontend_user:5173";
    set $spa_admin "http://frontend_admin:5174";

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ { proxy_pass $django; }
    # receipts are private — only via /api/v1/payments/<id>/receipt/ (auth-checked)
    location /media/receipts/ { return 404; }
    location /media/apps/ { return 404; }       # operator apps: admin API only
    location /media/  { proxy_pass $django; }

    location ~ ^/(api|admin)/ {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # dev: Channels auto-patches `runserver` to serve ASGI (HTTP + WS) on the
    # same port, so this proxies to the same $django upstream as /api/.
    location /ws/ {
        proxy_pass $django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400;
    }

    location /panel/ {
        proxy_pass $spa_admin;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass $spa_user;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
