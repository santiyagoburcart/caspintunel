# PROD reverse proxy. Mounted at /etc/nginx/conf.d/caspintunel.conf by
# docker-compose.prod.yml. SPAs are served by their own nginx images.

upstream django { server web:8000; }
upstream spa_user { server frontend_user:80; }
upstream spa_admin { server frontend_admin:80; }

server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    location /static/ {
        proxy_pass http://django;
        expires 30d;
    }
    location /media/ {
        proxy_pass http://django;
        expires 7d;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /panel/ { proxy_pass http://spa_admin; proxy_set_header Host $host; }
    location / { proxy_pass http://spa_user; proxy_set_header Host $host; }
}
