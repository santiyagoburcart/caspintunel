# PROD reverse proxy. Mounted at /etc/nginx/conf.d/caspintunel.conf by
# docker-compose.prod.yml. SPAs are served by their own nginx images.
# TLS: /nginx-entrypoint.sh drops a 10-ssl.conf here when a cert exists.

# Upstreams are variables (set $django …), so nginx re-resolves the service
# names at runtime and balances over every container behind a name. During a
# rolling deploy (update.sh) old + new containers both answer; the short DNS
# cache and connect timeout + retry below make the old one's exit invisible.
resolver 127.0.0.11 valid=2s ipv6=off;

# The HTTPS vhost (10-ssl.conf) terminates TLS and proxies to this plain-HTTP
# vhost on 127.0.0.1 with "X-Forwarded-Proto: https". Only trust that header
# from 127.0.0.1 — otherwise Django (SECURE_SSL_REDIRECT) would see every HTTPS
# request as http and redirect forever, and outside clients could spoof it.
# Real client IP for Django (throttling). Same trust rule: the TLS vhost on
# 127.0.0.1 passes it as X-Real-IP; anyone else is taken at $remote_addr.
# Django gets exactly ONE address (X-Forwarded-For is overwritten, never
# appended), so a client-supplied X-Forwarded-For can't pick its own
# rate-limit bucket. DRF reads it with NUM_PROXIES = 1.
map $remote_addr $client_ip {
    "127.0.0.1"  $http_x_real_ip;
    default      $remote_addr;
}

map "$remote_addr|$http_x_forwarded_proto" $fwd_proto {
    "~^127\.0\.0\.1\|https$"  https;
    default                     $scheme;
}

# Two CSPs: the user site (/) loads the Telegram SDK and must be frameable by
# Telegram (Mini App). The panel / API / Django admin stay locked down.
map $uri $csp {
    "~^/(api|admin|panel)(/|$)"  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    default                      "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy $csp always;
    # Django adds its own X-Frame-Options: DENY on /api/ + /admin/ responses;
    # framing everywhere else is governed by the CSP frame-ancestors above.

    # a request that can't connect to a (retiring) container is retried on the
    # next one; nothing has been sent yet, so this is safe for POSTs too
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;

    set $django "http://web:8000";
    set $django_ws "http://daphne:8001";
    set $spa_user "http://frontend_user:80";
    set $spa_admin "http://frontend_admin:80";

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # Public media (branding logo/favicon, etc.) — served straight from the volume.
    # Receipts are NOT public: /media/receipts/ 404s here; the app hands them out
    # through /api/v1/payments/<id>/receipt/ after an auth check, which then
    # X-Accel-Redirects to the internal location below.
    location = /media/ { return 404; }
    location /media/receipts/ { return 404; }
    location /media/apps/ { return 404; }       # operator apps: admin API only
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }
    location /_protected_media/ {
        internal;
        alias /var/www/media/;
        # private files (receipts, operator apps): never cache in browsers/proxies
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # gunicorn can't serve WebSockets — routed to the separate daphne service instead.
    location /ws/ {
        proxy_pass $django_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400;
    }

    location /panel/ { proxy_pass $spa_admin; proxy_set_header Host $host; }
    location / { proxy_pass $spa_user; proxy_set_header Host $host; }
}
