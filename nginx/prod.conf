# PROD reverse proxy. Mounted at /etc/nginx/conf.d/caspintunel.conf by
# docker-compose.prod.yml. SPAs are served by their own nginx images.
# TLS: /nginx-entrypoint.sh drops a 10-ssl.conf here when a cert exists.

resolver 127.0.0.11 valid=10s ipv6=off;

# Two CSPs: the user site (/) loads the Telegram SDK and must be frameable by
# Telegram (Mini App). The panel / API / Django admin stay locked down.
map $uri $csp {
    "~^/(api|admin|panel)(/|$)"  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    default                      "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy $csp always;
    # Django adds its own X-Frame-Options: DENY on /api/ + /admin/ responses;
    # framing everywhere else is governed by the CSP frame-ancestors above.

    set $django "http://web:8000";
    set $django_ws "http://daphne:8001";
    set $spa_user "http://frontend_user:80";
    set $spa_admin "http://frontend_admin:80";

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # Public media (branding logo/favicon, etc.) — served straight from the volume.
    # Receipts are NOT public: /media/receipts/ 404s here; the app hands them out
    # through /api/v1/payments/<id>/receipt/ after an auth check, which then
    # X-Accel-Redirects to the internal location below.
    location = /media/ { return 404; }
    location /media/receipts/ { return 404; }
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }
    location /_protected_media/ {
        internal;
        alias /var/www/media/;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gunicorn can't serve WebSockets — routed to the separate daphne service instead.
    location /ws/ {
        proxy_pass $django_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /panel/ { proxy_pass $spa_admin; proxy_set_header Host $host; }
    location / { proxy_pass $spa_user; proxy_set_header Host $host; }
}
